# Cấu hình AI fallback (khi DB chưa có cấu hình).
# Admin có thể cấu hình lại trong trang /admin/ai-settings
#
# Gợi ý dùng Google Gemini (miễn phí): lấy API key tại https://aistudio.google.com/apikey
#   rồi dán vào ô "API Key" trong trang quản trị, hoặc điền ai.apiKey bên dưới.
#
# Provider khác (tương thích OpenAI):
#   OpenAI    -> https://api.openai.com/v1          | gpt-4o-mini
#   DeepSeek  -> https://api.deepseek.com/v1        | deepseek-chat
#   OpenRouter-> https://openrouter.ai/api/v1       | openai/gpt-4o-mini

ai.provider=GOOGLE
ai.apiKey=
ai.baseUrl=https://generativelanguage.googleapis.com/v1beta/openai
ai.model=gemini-3.5-flash
ai.temperature=0.7
ai.maxTokens=2048
